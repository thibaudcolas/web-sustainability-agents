# ---------------------------------------------------------------------------
# MkDocs configuration.
#
# Docs: https://www.mkdocs.org/user-guide/configuration/
# Material theme: https://squidfunk.github.io/mkdocs-material/
#
# Convention: most changes to `markdown_extensions`, `plugins`, and theme `features` need a comment explaining what the option does.
# ---------------------------------------------------------------------------

site_name: Web sustainability agents
repo_url: https://github.com/thibaudcolas/web-sustainability-agents
site_url: https://thibaudcolas.github.io/web-sustainability-agent/
docs_dir: docs
# Shared abbreviation definitions are read by snippets, not rendered as a page.
exclude_docs: |
  /contributing/abbreviations.md
# Publish raw skills and discovery catalogs after rendering the documentation.
hooks:
  - scripts/publish_skills.py
# Rebuild the catalogs when skills or their supporting resources change locally.
watch:
  - .agents/skills
# "Edit on GitHub" links point to the source Markdown on the main branch.
edit_uri: edit/main/docs

site_description: Research and implementation of agentic web sustainability audits.
repo_name: thibaudcolas/web-sustainability-agents
# Avoid clashes with other docs servers running on the default 8000 port.
dev_addr: localhost:8001

theme:
  name: material
  # Use system fonts without requesting fonts from Google.
  font: false
  logo: theme/favicon.png
  favicon: theme/favicon.png
  palette:
    # Light and dark palettes, each tied to the system preference so the
    # site matches the reader's OS by default but can still be toggled.
    # Custom colors live in theme.css; both schemes are tuned for comfortable contrast over long reading sessions.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # ---- Code blocks ----
    # "Copy" button on fenced code blocks.
    - content.code.copy
    # Allow `# (1)` style annotations inside fenced code blocks. See
    # https://squidfunk.github.io/mkdocs-material/reference/code-blocks/#code-annotations
    - content.code.annotate
    # ---- Page actions ----
    # "Edit this page" button on every page, paired with `edit_uri` above.
    # Makes it one click to open the Markdown source for a fix.
    - content.action.edit
    # "View source" button showing the rendered Markdown file on GitHub,
    # so readers can see the source as it appears in the repo.
    - content.action.view
    # ---- Tabbed content blocks ----
    # Share selected state across tabbed blocks on a page: switching a tab in
    # one place switches the matching tab elsewhere. Requires the
    # `pymdownx.tabbed` extension (enabled below).
    - content.tabs.link
    # ---- Reading experience ----
    # Smooth scrolling and a small progress bar at the top of the page;
    # `instant` loads pages without a full reload.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    # Top-level navigation renders as tabs; the active tab stays visible.
    - navigation.tabs
    - navigation.tabs.sticky
    # Top-level groups render as sections; auto-expand active section.
    - navigation.sections
    - navigation.expand
    # Breadcrumb path under the header.
    - navigation.path
    # The first item in a section (a `README.md` index page) renders as the
    # section landing page rather than a duplicate entry.
    - navigation.indexes
    # "Back to top" button on long pages.
    - navigation.top
    # Prev/next links in the footer.
    - navigation.footer
    # Update the browser URL with the active anchor as the reader scrolls,
    # so deep links land on the right section.
    - navigation.tracking
    # Right-side table of contents auto-scrolls to follow the active heading.
    - toc.follow
    # Render hover tooltips where authors use `abbr` or inline definitions.
    - content.tooltips
    # ---- Search ----
    - search.highlight
    - search.suggest
    - search.share
  custom_dir: docs/theme

extra_css:
  - theme/theme.css

markdown_extensions:
  # Python-Markdown core extensions.
  - abbr
  - admonition
  # Lets us attach `{ .class }` to block/inline elements – used by
  # annotations and a few callouts.
  - attr_list
  - def_list
  - footnotes
  # Allow Markdown to be written inside HTML blocks (used by custom theme
  # overrides in `docs/theme`).
  - md_in_html
  - sane_lists
  - toc:
      permalink: true

  # PyMdown Extensions.
  # Collapsible `??? note` / `!!! note` admonitions.
  - pymdownx.details
  # Syntax highlighting in fenced code blocks; `anchor_linenums` makes line
  # numbers linkable so we can point at a specific line.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Inline code highlighting: `` `!python function() `` is highlighted inline.
  - pymdownx.inlinehilite
  # Auto-link bare URLs. Use explicit Markdown links for issues and pull requests.
  - pymdownx.magiclink
  # Pulls in snippet files; `auto_append` attaches `abbreviations.md` to
  # every page so abbreviation tooltips work everywhere.
  - pymdownx.snippets:
      base_path: docs
      # Missing includes must fail the build instead of silently dropping content.
      check_paths: true
      auto_append:
        - contributing/abbreviations.md
  # Tabbed content blocks: `=== "Tab title"`. Requires the
  # `content.tabs.link` theme feature to share state across tab groups.
  - pymdownx.tabbed:
      alternate_style: true
  # Extended fenced code: allows nested code blocks inside admonitions and
  # other constructs where the standard fence would fail.
  - pymdownx.superfences
  # `- [x]` checkboxes render as styled checkboxes.
  - pymdownx.tasklist:
      custom_checkbox: true
  # `~~strikethrough~~` and `~subscript~` shortcuts.
  - pymdownx.tilde

plugins:
  # Apply shared front matter from each section's .meta.yml before indexing pages.
  - meta
  - search
  # Show the last-modified date of each page based on git history.
  - git-revision-date-localized:
      type: date
      # Use the build date for files not yet committed, so `--strict`
      # builds pass for new pages.
      fallback_to_build_date: true
  # Generate `llms.txt` / `llms-full.txt` for LLM consumption. Keep the
  # `sections` mapping in sync with `nav` below.
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Home:
          - index.md
          - agent-skills.md
          - tags.md
        Contributing:
          # List pages explicitly so the abbreviation snippet is not exported.
          - contributing/README.md
          - contributing/style-guide.md
          - contributing/quality-assurance.md
          - contributing/architecture.md
        Feasibility study:
          - feasibility-study/*.md
        Initial implementation work:
          - initial-implementation/*.md
        Knowledge base:
          - knowledge-base/*.md
  # Collect page and folder tags into the listing marked in tags.md.
  - tags

# Treat structural mistakes as warnings, so `--strict` builds fail on them.
validation:
  nav:
    # Every docs page must be in nav or matched by the top-level not_in_nav setting.
    omitted_files: warn
    absolute_links: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Feasibility study:
      - feasibility-study/README.md
      - Proposed audit architecture: feasibility-study/architecture.md
      - Portable audits and project evidence: feasibility-study/portable-audits.md
      - Decision models: feasibility-study/decision-models.md
      - Decision-model examples: feasibility-study/decision-model-examples.md
      - Evaluation approach: feasibility-study/evaluation.md
      - Sources and research method: feasibility-study/sources.md
  - Initial implementation work:
      - initial-implementation/README.md
      - WIP guide audit: initial-implementation/guide-audit.md
      - WIP Wagtail.org audit: initial-implementation/wagtail-audit.md
      - Energy and traffic experiment: initial-implementation/energy-traffic-experiment.md
      - Per-site reports and chart data: initial-implementation/reporting.md
      - Implementation backlog: initial-implementation/backlog.md
      - Staged measurements and context: initial-implementation/staged-auditing.md
      - Model and real-site review checkpoint: initial-implementation/review-checkpoint.md
      - First executable slice and results: initial-implementation/first-slice.md
      - Expanded evidence benchmark: initial-implementation/expanded-benchmark.md
      - Harbor benchmark: initial-implementation/benchmark.md
      - Demo sites and benchmark targets: initial-implementation/test-sites.md
      - Model comparison plan: initial-implementation/model-comparison.md
      - Validation roadmap: initial-implementation/validation-roadmap.md
      - Sources and implementation evidence: initial-implementation/sources.md
  - Knowledge base:
      - knowledge-base/README.md
      - WSG and STAR: knowledge-base/wsg-and-star.md
      - Digital Carbon Ratings: knowledge-base/digital-carbon-ratings.md
      - Browser energy and traffic scenarios: knowledge-base/energy-and-traffic.md
      - Deterministic audit tools: knowledge-base/deterministic-tools.md
      - Lessons from existing audit projects: knowledge-base/local-projects.md
      - Model providers and inference accounting: knowledge-base/provider-capabilities.md
  - Agent skills: agent-skills.md
  - Tags: tags.md
  - Contributing:
      - contributing/README.md
      - Documentation style guide: contributing/style-guide.md
      - Quality assurance: contributing/quality-assurance.md
      - Project architecture: contributing/architecture.md
